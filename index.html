<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Output</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="box">
        <form id="upload-form">
            <input id="backend-url" type="hidden" value="http://127.0.0.1:8002">
            <input id="party-id" type="hidden" value="SEKURA">
            <input id="site-ref-key" type="hidden" value="">

            <input id="file" name="file" type="file" accept=".xlsx,.xlsm" required>
            <button type="submit">Download Output</button>
        </form>

        <div id="status" class="status" hidden></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
