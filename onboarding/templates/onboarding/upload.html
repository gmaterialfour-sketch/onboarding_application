<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Output</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }
        .box {
            width: min(420px, calc(100% - 32px));
            padding: 24px;
            background: #fff;
            border: 1px solid #d8e0ec;
            border-radius: 8px;
        }
        form { display: grid; gap: 14px; }
        input[type="file"] {
            width: 100%;
            padding: 14px;
            border: 1px dashed #94a3b8;
            border-radius: 8px;
            background: #fbfdff;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 14px 18px;
            background: #0f766e;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .errors {
            margin-bottom: 14px;
            padding: 12px;
            border-radius: 8px;
            color: #991b1b;
            background: #fef2f2;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="box">
        {% if errors %}
            <div class="errors">
                {% for field, messages in errors.items %}
                    {% if messages|length %}
                        {% for message in messages %}
                            {{ message }}<br>
                        {% endfor %}
                    {% else %}
                        {{ messages }}
                    {% endif %}
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="real_data" id="real_data" accept=".xlsx,.xlsm" required>
            <button type="submit">Download Output</button>
        </form>
    </main>
</body>
</html>
